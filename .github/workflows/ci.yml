name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: apigw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.19.0
      - run: npm install
      - run: npm run docs:test
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run build
      - name: Setup Database
        run: |
          npm run db:migrate:deploy -w packages/database
          npm run db:seed -w packages/database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/apigw?schema=public
      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/apigw?schema=public
