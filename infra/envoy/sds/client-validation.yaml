resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: client_validation_context
    validation_context:
      trusted_ca:
        filename: /run/platform-secrets/pki/trust-bundle.pem
      crl:
        filename: /run/platform-secrets/pki/crl-bundle.pem
      only_verify_leaf_cert_crl: true
