x-platform-app: &platform-app
  image: api-gateway-platform-local:dev
  pull_policy: never

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apigw
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apigw"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run through npm run dev:local}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./.local-secrets/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak-data:/opt/keycloak/data

  database-setup:
    <<: *platform-app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    command:
      - sh
      - -c
      - >
        npm run db:migrate:deploy --workspace=packages/database &&
        npm run db:seed --workspace=packages/database &&
        npm run db:seed:policies --workspace=packages/database
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/apigw?schema=public
      DEV_UPSTREAM_BASE_URL: http://mock-backend:4000
      DEV_CLIENT_PUBLIC_JWK: ${DEV_CLIENT_PUBLIC_JWK:?Run through npm run dev:local}
      DEV_MTLS_CERT_FINGERPRINT: ${DEV_MTLS_CERT_FINGERPRINT:?Run through npm run dev:local}
      DEV_MTLS_CERT_FINGERPRINT_SECOND: ${DEV_MTLS_CERT_FINGERPRINT_SECOND:?Run through npm run dev:local}
      DEV_MTLS_CA_CERTIFICATE_BASE64: ${DEV_MTLS_CA_CERTIFICATE_BASE64:?Run through npm run dev:local}
      DEV_MTLS_CRL_BASE64: ${DEV_MTLS_CRL_BASE64:?Run through npm run dev:local}
      DEV_MTLS_CLIENT_CERTIFICATE_BASE64: ${DEV_MTLS_CLIENT_CERTIFICATE_BASE64:?Run through npm run dev:local}
      DEV_MTLS_CLIENT_CERTIFICATE_SECOND_BASE64: ${DEV_MTLS_CLIENT_CERTIFICATE_SECOND_BASE64:?Run through npm run dev:local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mock-backend:
    <<: *platform-app
    command: ["node", "mock-backend.js"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 20

  gateway:
    <<: *platform-app
    command: ["node", "packages/gateway-core/dist/index.js"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/apigw?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_ENVIRONMENT_ID: env-qual-es
      OAUTH_ISSUER: https://localhost:8443
      OAUTH_TOKEN_ENDPOINT_AUDIENCE: https://localhost:8443/oauth/token
      OAUTH_SIGNING_KEY_ID: local-gateway-1
      OAUTH_SIGNING_PRIVATE_KEY_BASE64: ${OAUTH_SIGNING_PRIVATE_KEY_BASE64:?Run through npm run dev:local}
      MTLS_TRUSTED_PROXY_CIDRS: 172.30.0.250/32
    depends_on:
      database-setup:
        condition: service_completed_successfully
      mock-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 20

  management-api:
    <<: *platform-app
    command: ["node", "packages/management-api/dist/index.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://postgres:password@postgres:5432/apigw?schema=public
      OIDC_ISSUER: http://localhost:8081/realms/api-gateway
      OIDC_AUDIENCE: management-api
      OIDC_JWKS_URI: http://keycloak:8080/realms/api-gateway/protocol/openid-connect/certs
      PKI_KEYSTORE_DIR: /run/platform-secrets/pki/keystore
      PKI_MASTER_KEY_FILE: /run/platform-secrets/pki/master.key
      PKI_TRUST_BUNDLE_FILE: /run/platform-secrets/pki/trust-bundle.pem
      PKI_CRL_BUNDLE_FILE: /run/platform-secrets/pki/crl-bundle.pem
      PKI_SDS_TRIGGER_FILE: /runtime-sds/client-validation.yaml
    volumes:
      - ./.local-secrets:/run/platform-secrets
      - ./infra/envoy/sds:/runtime-sds
    depends_on:
      database-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3002/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30

  admin-panel:
    <<: *platform-app
    command:
      - npm
      - run
      - start
      - --workspace=packages/admin-panel
      - --
      - -p
      - "8080"
      - -H
      - 0.0.0.0
    environment:
      MANAGEMENT_API_URL: http://management-api:3002
      OIDC_ISSUER: http://localhost:8081/realms/api-gateway
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      OIDC_CLIENT_ID: admin-panel
      OIDC_CALLBACK_URL: http://localhost:8080/api/auth/callback
    ports:
      - "8080:8080"
    depends_on:
      management-api:
        condition: service_healthy
      keycloak:
        condition: service_started

  envoy:
    image: envoyproxy/envoy:v1.33.1
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "${ENVOY_LOG_LEVEL:-warning}"]
    ports:
      - "8443:8443"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/envoy/sds:/etc/envoy/sds:ro
      - ./.local-secrets:/run/platform-secrets:ro
    networks:
      default:
        ipv4_address: 172.30.0.250
    depends_on:
      gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    profiles: ["observability"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  keycloak-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
